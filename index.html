<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="format-detection" content="telephone=no"><title>YONGHO CHALLENGE 100</title><style>body{margin:0;background:#080b12;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif}.app{max-width:720px;margin:auto;padding:18px}.card{background:#121824;border:1px solid #293246;border-radius:20px;padding:18px;margin-bottom:12px}.hidden{display:none}.gold{color:#ffd23f}.btn{width:100%;padding:14px;border:0;border-radius:12px;font-weight:800;font-size:16px;margin-top:10px}.btn.goldbtn{background:#ffd23f;color:#171200}.btn.dark{background:#202a3a;color:#fff}.field{margin-top:12px}.field label{display:block;font-size:12px;color:#aab4c5;margin-bottom:6px}.field input,.field select{width:100%;box-sizing:border-box;padding:14px;border-radius:12px;border:1px solid #38445b;background:#0b1018;color:#fff;font-size:16px}.top{display:flex;justify-content:space-between;align-items:center}.score{font-size:56px;font-weight:900}.bar{height:14px;background:#090c12;border-radius:99px;overflow:hidden;border:1px solid #2c3649}.fill{height:100%;background:#ffd23f;width:0}.mission{display:flex;gap:10px;align-items:center;padding:13px;border:1px solid #2a3448;border-radius:14px;margin:8px 0;background:#0d121b}.mission.done{border-color:#2e7447;background:#0d1912}.check{width:25px;height:25px;border:2px solid #56627a;border-radius:8px;flex:none}.done .check{background:#55d983;border-color:#55d983}.done .check:after{content:'✓';display:block;text-align:center;color:#07130c;font-weight:900}.txt{flex:1}.pts{color:#ffd23f;font-weight:900}.rank{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #253047}.muted{color:#9da8ba;font-size:12px}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}.tabs button{padding:11px;border:1px solid #2c3649;border-radius:11px;background:#111722;color:#fff}.badge{display:inline-block;padding:8px 10px;margin:4px;border-radius:11px;background:#171f2d;border:1px solid #39445b}.off{opacity:.35}@supports(padding:max(0px)){.app{padding-top:max(18px,env(safe-area-inset-top));padding-bottom:max(30px,env(safe-area-inset-bottom))}}</style></head><body><div class="app"><section id="login"><div class="card"><div class="gold" style="font-weight:900">2026 YONGHO TAEKWONDO</div><h1>YONGHO CHALLENGE 100</h1><p class="muted">100점을 달성해 용호레전드에 도전하자</p><form id="loginForm"><div class="field"><label>이름</label><input id="name" required placeholder="예: 김태권"></div><div class="field"><label>현재 띠(품·단)</label><select id="belt" required><option value="">선택하세요</option><option>흰띠</option><option>노란띠</option><option>초록띠</option><option>파란띠</option><option>보라띠</option><option>밤띠</option><option>주황띠</option><option>빨간띠</option><option>1품(단)</option><option>2품(단)</option><option>3품(단)</option><option>4품(단)</option></select></div><button class="btn goldbtn" type="submit">도전 시작</button></form><button id="adminBtn" class="btn dark" type="button">관리자 화면</button><div id="msg" class="muted" style="margin-top:10px"></div></div></section><section id="student" class="hidden"><div class="top"><b class="gold">YONGHO CHALLENGE 100</b><button id="logout" class="btn dark" style="width:auto;margin:0;padding:8px 12px">나가기</button></div><div class="card"><div id="who" class="gold"></div><h2 id="hello"></h2><div class="score"><span id="score">0</span><small style="font-size:16px;color:#9da8ba"> / 100</small></div><div id="level" style="font-weight:900;margin:6px 0"></div><div class="bar"><div id="fill" class="fill"></div></div></div><div class="tabs"><button data-tab="missions">⚔️ 미션</button><button data-tab="rank">🏆 순위</button><button data-tab="badges">🎖️ 배지</button></div><div id="missionsPane"></div><div id="rankPane" class="hidden"></div><div id="badgesPane" class="hidden"></div><div class="card"><button id="submitFinal" class="btn goldbtn">🏁 이번 달 최종점수 제출</button><div id="finalInfo" class="muted" style="margin-top:10px"></div></div></section><section id="admin" class="hidden"><div class="card"><h2>관리자 화면</h2><div id="adminList"></div><button id="adminBack" class="btn dark">돌아가기</button></div></section></div><script>(function(){'use strict';var K='yonghoChallengeWeb_v1';var M=[['출석 POWER',[['a1','1주일 목표 출석 성공',5],['a2','2주 연속 목표 출석 성공',5],['a3','3주 연속 목표 출석 성공',5],['a4','4주 최종 출석 목표 성공',5]]],['태권도 LEVEL UP',[['t1','품새수련 스스로 주3회 이상 성공',5],['t2','내려차기 50회 주 3회 이상 성공',5],['t3','정확한 기본동작 미션 성공',5],['t4','관장·사범님 특별미션 성공',5]]],['체력 CHALLENGE',[['f1','줄넘기 개인연습 주 3회이상 성공',5],['f2','유연성 목표 성공',5],['f3','보충수련 1회이상 참여하기',5],['f4','지정발차기 10회 연습(주 1회 이상 성공)',5]]],['CHARACTER',[['c1','먼저 큰소리로 인사하기',5],['c2','후배 또는 친구 도와주기',5],['c3','수련 중 포기하지 않고 끝까지 도전',5],['c4','관장·사범님 특별 칭찬 받기',5]]],['FRIEND MISSION',[['r1','친구에게 챌린지 소개하기',2],['r2','친구와 함께 수련 참여',5],['r3','처음 온 친구와 팀미션 성공',5],['r4','친구가 한 번 더 도전',8]]]];var db={students:{}};try{db=JSON.parse(localStorage.getItem(K)||'{"students":{}}')}catch(e){}var cur=null;function s(){try{localStorage.setItem(K,JSON.stringify(db));return true}catch(e){return false}}function id(n,b){return n+'#'+b}function score(x){var t=0;x.states=x.states||{};M.forEach(function(g){g[1].forEach(function(m){if(x.states[m[0]])t+=m[2]})});return t}function level(n){if(n>=100)return'🏆 YONGHO LEGEND';if(n>=95)return'🔥 MASTER';if(n>=80)return'⚫ BLACK CHALLENGER';if(n>=60)return'🔴 FIGHTER';if(n>=40)return'🔵 CHALLENGER';return'🥋 ROOKIE'}function show(x){['login','student','admin'].forEach(function(i){document.getElementById(i).classList.add('hidden')});document.getElementById(x).classList.remove('hidden')}function render(){var x=db.students[cur],sc=score(x);document.getElementById('who').textContent=x.name+' · '+x.belt;document.getElementById('hello').textContent=x.name+' 도전자';document.getElementById('score').textContent=sc;document.getElementById('level').textContent=level(sc);document.getElementById('fill').style.width=Math.min(100,sc)+'%';var h='';M.forEach(function(g){h+='<div class="card"><b>'+g[0]+'</b>';g[1].forEach(function(m){var d=x.states&&x.states[m[0]];h+='<div class="mission '+(d?'done':'')+'" data-id="'+m[0]+'"><div class="check"></div><div class="txt">'+m[1]+'</div><div class="pts">+'+m[2]+'</div></div>'});h+='</div>'});document.getElementById('missionsPane').innerHTML=h;Array.prototype.forEach.call(document.querySelectorAll('.mission'),function(el){el.onclick=function(){x.states=x.states||{};x.states[this.dataset.id]=!x.states[this.dataset.id];s();render()}});var arr=Object.keys(db.students).map(function(k){return{name:db.students[k].name,belt:db.students[k].belt,score:score(db.students[k])}}).sort(function(a,b){return b.score-a.score});document.getElementById('rankPane').innerHTML='<div class="card"><h3>실시간 순위</h3>'+arr.map(function(v,i){return'<div class="rank"><span>'+(i+1)+'위 · '+v.name+' · '+v.belt+'</span><b class="gold">'+v.score+'점</b></div>'}).join('')+'</div>';var bs=[20,40,60,80,95,100];document.getElementById('badgesPane').innerHTML='<div class="card"><h3>MY BADGES</h3>'+bs.map(function(v){return'<span class="badge '+(sc>=v?'':'off')+'">'+v+'점</span>'}).join('')+'</div>';document.getElementById('finalInfo').textContent=x.final?'제출점수 '+x.final+'점 · 관리자 확인 대기':'월말에 현재 점수만 제출하세요'}document.getElementById('loginForm').addEventListener('submit',function(e){e.preventDefault();var n=document.getElementById('name').value.trim(),b=document.getElementById('belt').value;if(!n||!b){document.getElementById('msg').textContent='이름과 띠를 입력해주세요.';return}cur=id(n,b);if(!db.students[cur])db.students[cur]={name:n,belt:b,states:{},final:null};s();show('student');render()});document.getElementById('logout').onclick=function(){cur=null;show('login')};document.getElementById('submitFinal').onclick=function(){var x=db.students[cur];x.final=score(x);s();render()};Array.prototype.forEach.call(document.querySelectorAll('[data-tab]'),function(b){b.onclick=function(){['missionsPane','rankPane','badgesPane'].forEach(function(i){document.getElementById(i).classList.add('hidden')});document.getElementById(this.dataset.tab+'Pane').classList.remove('hidden')}});document.getElementById('adminBtn').onclick=function(){var p=prompt('관리자 PIN');if(p!=='2580')return;var a=Object.keys(db.students).map(function(k){var x=db.students[k];return'<div class="rank"><span>'+x.name+' · '+x.belt+'</span><b>'+score(x)+'점 / 제출 '+(x.final==null?'-':x.final)+'</b></div>'}).join('');document.getElementById('adminList').innerHTML=a||'<p class="muted">등록된 제자가 없습니다.</p>';show('admin')};document.getElementById('adminBack').onclick=function(){show('login')};if(!s())document.getElementById('msg').textContent='Safari 저장 제한이 감지되었습니다. 일반 Safari 탭으로 접속해주세요.';})();</script></body></html>
