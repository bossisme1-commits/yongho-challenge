<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#185fd2"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="스마트폰 멈춤"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg"><title>스마트폰 잠시 멈춤</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f8ff;color:#102454;font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',Arial,sans-serif}.wrap{max-width:520px;margin:auto;padding:20px}.card{background:#fff;border-radius:26px;padding:26px;box-shadow:0 10px 30px rgba(20,65,130,.12);text-align:center}.badge{display:inline-block;background:#eaf2ff;color:#185fd2;padding:8px 14px;border-radius:999px;font-weight:900}h1{font-size:34px;line-height:1.15;margin:16px 0 8px}.lead{color:#60749a;line-height:1.55}.icon{width:108px;height:108px;margin:18px auto}.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:20px 0}.step{padding:12px 6px;border:1px solid #dce7f9;border-radius:15px;background:#f9fbff;font-size:13px;font-weight:900}.step b{display:block;font-size:25px;margin-bottom:4px}.install{width:100%;border:0;border-radius:16px;padding:17px;background:#185fd2;color:white;font-size:20px;font-weight:900}.install:disabled{opacity:.45}.ios{margin-top:10px;width:100%;border:0;border-radius:16px;padding:15px;background:#eef4ff;color:#185fd2;font-weight:900}.status{margin-top:18px;padding:14px;border-radius:14px;background:#fff8df;color:#7b5900;line-height:1.5;font-size:14px}.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);padding:18px;align-items:flex-end}.box{background:white;border-radius:22px;padding:22px;max-width:500px;width:100%;margin:auto;text-align:left}.box h2{margin-top:0}.box p{font-weight:800}.close{width:100%;border:0;border-radius:14px;padding:14px;background:#185fd2;color:white;font-weight:900}</style></head><body><main class="wrap"><section class="card"><span class="badge">📵 스마트폰 잠시 멈춤</span><img class="icon" src="./icon.svg" alt=""><h1>QR 연결 완료!</h1><p class="lead">이 주소는 앞으로도 그대로 사용합니다.<br>앱을 수정해도 <b>QR은 바꾸지 않아도 됩니다.</b></p><div class="steps"><div class="step"><b>📷</b>QR 찍기</div><div class="step"><b>📲</b>앱 열기</div><div class="step"><b>⭐</b>미션 참여</div></div><button id="install" class="install" hidden>앱 설치</button><button id="ios" class="ios" hidden>iPhone 설치 방법</button><div id="status" class="status">현재 QR과 설치 주소는 정상 연결되어 있습니다.<br>다음 단계에서 이름 적립·관리자 데이터 연동을 이 주소에 붙이면 됩니다.</div></section></main><div id="modal" class="modal"><div class="box"><h2>iPhone 홈 화면에 추가</h2><p>1. Safari의 공유 버튼을 누릅니다.</p><p>2. ‘홈 화면에 추가’를 선택합니다.</p><p>3. ‘추가’를 누릅니다.</p><button id="close" class="close">확인</button></div></div><script>let p=null;const install=document.getElementById('install'),ios=document.getElementById('ios'),modal=document.getElementById('modal');window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();p=e;install.hidden=false});install.onclick=async()=>{if(!p)return;p.prompt();await p.userChoice;p=null;install.hidden=true};const isi=/iphone|ipad|ipod/i.test(navigator.userAgent);const standalone=matchMedia('(display-mode:standalone)').matches||navigator.standalone;if(isi&&!standalone)ios.hidden=false;ios.onclick=()=>modal.style.display='flex';document.getElementById('close').onclick=()=>modal.style.display='none';if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});</script></body></html>
