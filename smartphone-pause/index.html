<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#185fd2"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="스마트폰 멈춤"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg"><title>스마트폰 잠시 멈춤</title><style>:root{--b:#185fd2;--n:#102454;--soft:#f4f8ff;--line:#dce7f9;--gold:#f4b800}*{box-sizing:border-box}body{margin:0;background:var(--soft);color:var(--n);font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',Arial,sans-serif}.wrap{max-width:520px;margin:auto;padding:18px}.card{background:#fff;border-radius:26px;padding:24px;box-shadow:0 10px 30px rgba(20,65,130,.12);text-align:center}.badge{display:inline-block;background:#eaf2ff;color:var(--b);padding:8px 14px;border-radius:999px;font-weight:900}h1{font-size:34px;line-height:1.15;margin:14px 0 8px}.lead{color:#60749a;line-height:1.55}.icon{width:92px;height:92px;margin:12px auto}.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0}.step{padding:12px 6px;border:1px solid var(--line);border-radius:15px;background:#f9fbff;font-size:13px;font-weight:900}.step b{display:block;font-size:24px;margin-bottom:4px}label{display:block;text-align:left;font-weight:900;margin:15px 0 7px}input{width:100%;padding:16px;border:2px solid #d7e2f4;border-radius:15px;font-size:22px;text-align:center;outline:none}input:focus{border-color:var(--b)}button{width:100%;border:0;border-radius:16px;padding:16px;font-size:19px;font-weight:900;cursor:pointer}.primary{background:var(--b);color:#fff;margin-top:12px}.secondary{background:#eef4ff;color:var(--b);margin-top:10px}.ghost{background:#fff;color:#66748c;border:1px solid #dde4ef;margin-top:10px}.result{display:none;margin-top:18px;background:#fff8df;border:1px solid #efd36c;border-radius:18px;padding:18px}.result.err{background:#fff0f0;border-color:#efb1b1}.result h2{margin:0 0 8px}.stars{font-size:34px;color:#e5a600;letter-spacing:4px;margin:12px 0}.coin{font-size:20px;font-weight:900;color:#a66a00}.mini{font-size:13px;line-height:1.5;color:#75839a;margin-top:16px}.installbox{margin-top:18px;padding-top:16px;border-top:1px solid #edf1f6}.admin{display:none;text-align:left}.admin h2{margin-top:0}.row{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid #edf1f6}.pill{font-size:12px;background:#eef4ff;color:var(--b);padding:4px 8px;border-radius:999px}.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);padding:18px;align-items:flex-end;z-index:5}.box{background:#fff;border-radius:22px;padding:22px;max-width:500px;width:100%;margin:auto;text-align:left}.close{background:var(--b);color:#fff;margin-top:14px}.warn{font-size:12px;color:#8a6a00;background:#fff9df;padding:10px;border-radius:10px;margin-top:12px}</style></head><body><main class="wrap"><section id="studentCard" class="card"><span class="badge">📵 자율 참여 미션</span><img class="icon" src="./icon.svg" alt=""><h1>스마트폰<br>잠시 멈춤!</h1><p class="lead">QR을 찍고 <b>내 이름만 입력</b>하면 끝!<br>수련 시간에는 스마트폰도 잠시 쉬어요.</p><div class="steps"><div class="step"><b>📷</b>QR 찍기</div><div class="step"><b>✍️</b>이름 입력</div><div class="step"><b>⭐</b>오늘 적립</div></div><form id="form"><label for="name">내 이름</label><input id="name" maxlength="20" autocomplete="name" placeholder="예: 김민준"><button id="submit" class="primary" type="submit">⭐ 오늘 참여하기</button></form><section id="result" class="result" aria-live="polite"><h2 id="msg"></h2><div id="stars" class="stars"></div><div id="detail"></div><div id="coin" class="coin"></div><button id="again" class="secondary" type="button">확인</button></section><div class="installbox"><button id="install" class="secondary" hidden type="button">📲 홈 화면에 앱 설치</button><button id="ios" class="secondary" hidden type="button">🍎 iPhone 설치 방법</button><button id="adminBtn" class="ghost" type="button">관리자 확인</button></div><p class="mini">하루 1회만 적립됩니다. 5번 참여할 때마다 1코인이 생겨요.</p></section><section id="adminCard" class="card admin"><h2>관리자 확인</h2><p class="mini">현재 이 버전의 기록은 각 휴대폰에 저장됩니다. 이 화면에서는 <b>이 기기에 저장된 기록만</b> 확인할 수 있습니다.</p><div id="adminList"></div><button id="back" class="secondary" type="button">학생 화면으로 돌아가기</button></section></main><div id="iosModal" class="modal"><div class="box"><h2>iPhone 홈 화면에 추가</h2><p>1. Safari의 <b>공유</b> 버튼을 누릅니다.</p><p>2. <b>홈 화면에 추가</b>를 선택합니다.</p><p>3. <b>추가</b>를 누르면 앱 아이콘이 생깁니다.</p><button id="closeIos" class="close">확인</button></div></div><script>(function(){'use strict';const KEY='smartphonePause_v2';const today=()=>{const d=new Date();const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${day}`};function load(){try{return JSON.parse(localStorage.getItem(KEY)||'{"students":{}}')}catch(e){return{students:{}}}}function save(db){localStorage.setItem(KEY,JSON.stringify(db))}function norm(s){return String(s||'').trim().replace(/\s+/g,'')}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}let db=load();const form=document.getElementById('form'),name=document.getElementById('name'),result=document.getElementById('result'),studentCard=document.getElementById('studentCard'),adminCard=document.getElementById('adminCard');form.addEventListener('submit',e=>{e.preventDefault();const display=name.value.trim(),k=norm(display);if(!k){show({ok:false,msg:'이름을 입력해 주세요.'});return}db=load();if(!db.students[k])db.students[k]={name:display,dates:[],coinsPaid:0};const s=db.students[k],t=today();if(s.dates.includes(t)){show({ok:false,dup:true,msg:'오늘은 이미 참여했어요!',student:s});return}s.name=display;s.dates.push(t);save(db);show({ok:true,msg:'오늘의 미션 성공!',student:s,coinJust:s.dates.length%5===0})});function show(x){result.style.display='block';result.classList.toggle('err',!x.ok&&!x.dup);document.getElementById('msg').textContent=x.msg;if(x.student){const total=x.student.dates.length,progress=total%5,filled=x.coinJust?5:progress;document.getElementById('stars').textContent='★'.repeat(filled)+'☆'.repeat(5-filled);document.getElementById('detail').textContent=`${x.student.name} · 누적 ${total}회`;document.getElementById('coin').textContent=x.coinJust?'🪙 1코인 획득!':`다음 코인까지 ${5-progress}회`}else{document.getElementById('stars').textContent='';document.getElementById('detail').textContent='';document.getElementById('coin').textContent=''}}document.getElementById('again').onclick=()=>{result.style.display='none';name.value='';name.focus()};document.getElementById('adminBtn').onclick=()=>{const p=prompt('관리자 PIN을 입력하세요.');if(p!=='8895')return alert('PIN이 올바르지 않습니다.');renderAdmin();studentCard.style.display='none';adminCard.style.display='block'};document.getElementById('back').onclick=()=>{adminCard.style.display='none';studentCard.style.display='block'};function renderAdmin(){db=load();const list=document.getElementById('adminList'),arr=Object.values(db.students).sort((a,b)=>b.dates.length-a.dates.length);if(!arr.length){list.innerHTML='<p class="mini">이 기기에 저장된 참여 기록이 없습니다.</p>';return}list.innerHTML=arr.map(s=>{const total=s.dates.length,coins=Math.floor(total/5),last=s.dates[s.dates.length-1]||'-';return `<div class="row"><div><b>${esc(s.name)}</b><div class="mini">최근 ${last}</div></div><div style="text-align:right"><span class="pill">${total}회</span><div class="mini">획득 ${coins}코인</div></div></div>`}).join('')}let deferred=null;const install=document.getElementById('install'),ios=document.getElementById('ios'),modal=document.getElementById('iosModal');window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;install.hidden=false});install.onclick=async()=>{if(!deferred)return;deferred.prompt();await deferred.userChoice;deferred=null;install.hidden=true};const isi=/iphone|ipad|ipod/i.test(navigator.userAgent),standalone=matchMedia('(display-mode:standalone)').matches||navigator.standalone;if(isi&&!standalone)ios.hidden=false;ios.onclick=()=>modal.style.display='flex';document.getElementById('closeIos').onclick=()=>modal.style.display='none';modal.onclick=e=>{if(e.target===modal)modal.style.display='none'};if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});})();</script></body></html>
