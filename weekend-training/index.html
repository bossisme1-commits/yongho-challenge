<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#165fd3"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="주말보충 스탬프"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg"><title>주말보충수련 스탬프</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f8ff;color:#102454;font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',Arial,sans-serif}.wrap{max-width:620px;margin:auto;padding:18px}.card{background:#fff;border-radius:26px;padding:22px;box-shadow:0 10px 30px rgba(20,65,130,.12)}.hero{text-align:center}.badge{display:inline-block;background:#eaf2ff;color:#165fd3;border-radius:999px;padding:8px 14px;font-weight:900}.hero h1{font-size:33px;line-height:1.18;margin:14px 0 6px}.hero p{margin:0;color:#60749a;line-height:1.55}.rewardbar{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0}.reward{border-radius:18px;padding:14px;text-align:center;font-weight:900}.r10{background:#eaf7ff;border:1px solid #a8d9f8}.r20{background:#fff6d7;border:1px solid #f0cc5b}.reward b{display:block;font-size:24px;margin-top:4px}.namebox{margin-top:16px}.namebox label{display:block;font-weight:900;margin:0 0 7px}.namebox input{width:100%;padding:16px;border:2px solid #d8e3f5;border-radius:15px;font-size:21px;text-align:center;outline:none}.namebox input:focus{border-color:#165fd3}.btn{width:100%;border:0;border-radius:16px;padding:17px;font-size:20px;font-weight:900;cursor:pointer}.primary{background:#165fd3;color:#fff;margin-top:12px}.secondary{background:#eef4ff;color:#165fd3;margin-top:9px}.status{margin-top:14px;border-radius:16px;padding:14px;text-align:center;background:#f7f9fd;color:#566987;font-weight:800;line-height:1.5}.stamps{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:18px}.stamp{aspect-ratio:1;border-radius:50%;border:3px dashed #bfcbe0;display:flex;align-items:center;justify-content:center;font-weight:900;color:#8b98ad;background:#fff;position:relative;font-size:16px}.stamp.done{background:#165fd3;color:#fff;border-style:solid;border-color:#165fd3}.stamp.m10{border-color:#39a5de}.stamp.m20{border-color:#f0b400}.stamp.done.m10{background:#39a5de}.stamp.done.m20{background:#f0b400;color:#4b3500}.stamp small{position:absolute;bottom:7px;font-size:10px}.progress{margin-top:16px}.track{height:14px;background:#e9eef7;border-radius:99px;overflow:hidden}.fill{height:100%;background:#165fd3;width:0}.progressline{display:flex;justify-content:space-between;margin-top:6px;font-size:13px;color:#61718e;font-weight:800}.message{margin-top:16px;border-radius:18px;padding:16px;text-align:center;background:#fff9e8;border:1px solid #f3d46b;display:none}.message strong{font-size:22px}.history{margin-top:18px}.history h2{font-size:18px;margin:0 0 10px}.history ul{margin:0;padding-left:20px;color:#5d6d88;line-height:1.7}.tiny{text-align:center;color:#7b889f;font-size:12px;line-height:1.5;margin-top:16px}.admin{margin-top:12px;text-align:center}.admin button{border:0;background:transparent;color:#9aa5b7;text-decoration:underline}.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);padding:18px;align-items:flex-end}.box{background:#fff;border-radius:22px;padding:22px;max-width:500px;width:100%;margin:auto}.box h2{margin-top:0}.box input{width:100%;padding:14px;border:1px solid #cfd8e7;border-radius:12px;font-size:18px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.danger{background:#fff0f0;color:#9c2c2c}.close{background:#eef4ff;color:#165fd3}@media(max-width:420px){.hero h1{font-size:29px}.rewardbar{grid-template-columns:1fr}.stamps{gap:7px}.stamp{font-size:14px}}</style></head><body><main class="wrap"><section class="card"><div class="hero"><span class="badge">🥋 토요일 보충수련</span><h1>주말보충수련<br>디지털 스탬프북</h1><p>보충수련에 꾸준히 참여하고<br><b>땀방울 포인트</b>도 모아보세요!</p></div><div class="rewardbar"><div class="reward r10">10회 참여<b>💧 50P</b></div><div class="reward r20">20회 참여<b>💧 100P</b></div></div><div class="namebox"><label for="name">내 이름</label><input id="name" maxlength="20" placeholder="예: 김민준" autocomplete="name"><button id="join" class="btn primary">⭐ 오늘 보충수련 참여하기</button><button id="changeName" class="btn secondary" hidden>이름 바꾸기</button></div><div id="status" class="status">토요일 보충수련에 참여한 뒤 버튼을 눌러주세요.</div><div class="progress"><div class="track"><div id="fill" class="fill"></div></div><div class="progressline"><span>0회</span><span id="countText">0 / 20</span><span>20회</span></div></div><div id="stamps" class="stamps"></div><div id="message" class="message" aria-live="polite"></div><section class="history"><h2>최근 참여 기록</h2><ul id="history"></ul></section><p class="tiny">※ 한국 시간 기준 토요일에만 적립되며, 같은 날에는 1회만 적립됩니다.<br>10회와 20회 달성 보상은 각각 1회씩 지급됩니다.</p><div class="admin"><button id="adminOpen" type="button">관리자 확인</button></div></section></main><div id="adminModal" class="modal"><div class="box"><h2>관리자 확인</h2><input id="adminPin" type="password" inputmode="numeric" placeholder="관리자 PIN"><div class="actions"><button id="adminConfirm" class="btn primary" type="button">확인</button><button id="adminClose" class="btn close" type="button">닫기</button></div><div id="adminArea" hidden><p id="adminSummary"></p><div class="actions"><button id="mark50" class="btn secondary" type="button">50P 지급완료</button><button id="mark100" class="btn secondary" type="button">100P 지급완료</button></div><button id="reset" class="btn danger" type="button">20회 완료 후 새 스탬프북 시작</button></div></div></div><script>(function(){'use strict';const KEY='weekendTrainingStamp_v1',PIN='8895';const els={name:document.getElementById('name'),join:document.getElementById('join'),changeName:document.getElementById('changeName'),status:document.getElementById('status'),stamps:document.getElementById('stamps'),fill:document.getElementById('fill'),countText:document.getElementById('countText'),message:document.getElementById('message'),history:document.getElementById('history'),adminOpen:document.getElementById('adminOpen'),modal:document.getElementById('adminModal'),adminPin:document.getElementById('adminPin'),adminConfirm:document.getElementById('adminConfirm'),adminClose:document.getElementById('adminClose'),adminArea:document.getElementById('adminArea'),adminSummary:document.getElementById('adminSummary'),mark50:document.getElementById('mark50'),mark100:document.getElementById('mark100'),reset:document.getElementById('reset')};let state=load();function load(){try{return JSON.parse(localStorage.getItem(KEY))||{name:'',dates:[],paid50:false,paid100:false,cycles:0}}catch(e){return{name:'',dates:[],paid50:false,paid100:false,cycles:0}}}function save(){localStorage.setItem(KEY,JSON.stringify(state))}function kstParts(){const p=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit',weekday:'short'}).formatToParts(new Date());const o={};p.forEach(x=>o[x.type]=x.value);return{key:`${o.year}-${o.month}-${o.day}`,weekday:o.weekday}}function render(){if(state.name){els.name.value=state.name;els.name.disabled=true;els.changeName.hidden=false}else{els.name.disabled=false;els.changeName.hidden=true}const c=Math.min(state.dates.length,20);els.countText.textContent=`${c} / 20`;els.fill.style.width=`${c/20*100}%`;els.stamps.innerHTML='';for(let i=1;i<=20;i++){const d=document.createElement('div');d.className='stamp'+(i<=c?' done':'')+(i===10?' m10':'')+(i===20?' m20':'');d.textContent=i;if(i===10||i===20){const s=document.createElement('small');s.textContent=i===10?'50P':'100P';d.appendChild(s)}els.stamps.appendChild(d)}els.history.innerHTML='';const recent=state.dates.slice().reverse().slice(0,5);if(!recent.length){const li=document.createElement('li');li.textContent='아직 참여 기록이 없습니다.';els.history.appendChild(li)}else recent.forEach(v=>{const li=document.createElement('li');li.textContent=v;els.history.appendChild(li)});const t=kstParts();if(t.weekday!=='Sat')els.status.textContent='오늘은 토요일이 아니어서 적립할 수 없어요.';else if(state.dates.includes(t.key))els.status.textContent='오늘은 이미 적립했어요. 다음 토요일에 다시 도전해요!';else els.status.textContent='오늘 보충수련에 참여했다면 아래 버튼을 눌러주세요.'}function rewardMessage(c){els.message.style.display='block';if(c===10){els.message.innerHTML='<strong>🎉 10회 달성!</strong><br>땀방울 <b>50포인트</b>를 받을 수 있어요!'}else if(c===20){els.message.innerHTML='<strong>🏆 20회 달성!</strong><br>땀방울 <b>100포인트</b>를 받을 수 있어요!'}else{els.message.innerHTML=`<strong>⭐ ${c}번째 스탬프!</strong><br>꾸준한 참여가 멋진 습관을 만들어요.`}}els.join.addEventListener('click',()=>{const name=els.name.value.trim();if(!name){els.status.textContent='이름을 입력해 주세요.';els.name.focus();return}if(!state.name){state.name=name}else if(state.name!==name){els.status.textContent='저장된 이름과 달라요. 이름 바꾸기를 눌러주세요.';return}const t=kstParts();if(t.weekday!=='Sat'){els.status.textContent='토요일 보충수련에만 적립할 수 있어요.';return}if(state.dates.includes(t.key)){els.status.textContent='오늘은 이미 적립했어요.';return}if(state.dates.length>=20){els.status.textContent='20회를 모두 달성했어요. 관리자 확인 후 새 스탬프북을 시작해 주세요.';return}state.dates.push(t.key);save();render();rewardMessage(state.dates.length)});els.changeName.addEventListener('click',()=>{if(!confirm('이름을 바꾸면 현재 스탬프 기록은 그대로 유지됩니다. 이름만 바꿀까요?'))return;state.name='';save();els.name.value='';render();els.name.focus()});els.adminOpen.addEventListener('click',()=>{els.modal.style.display='flex';els.adminPin.value='';els.adminArea.hidden=true});els.adminClose.addEventListener('click',()=>els.modal.style.display='none');els.adminConfirm.addEventListener('click',()=>{if(els.adminPin.value!==PIN){alert('관리자 PIN이 올바르지 않습니다.');return}els.adminArea.hidden=false;renderAdmin()});function renderAdmin(){const c=state.dates.length;els.adminSummary.innerHTML=`<b>${state.name||'이름 미등록'}</b><br>현재 ${c}/20회 · 50P ${state.paid50?'지급완료':'미지급'} · 100P ${state.paid100?'지급완료':'미지급'}`;els.mark50.disabled=c<10||state.paid50;els.mark100.disabled=c<20||state.paid100;els.reset.disabled=c<20}els.mark50.addEventListener('click',()=>{state.paid50=true;save();renderAdmin();alert('50P 지급완료로 처리했습니다.')});els.mark100.addEventListener('click',()=>{state.paid100=true;save();renderAdmin();alert('100P 지급완료로 처리했습니다.')});els.reset.addEventListener('click',()=>{if(state.dates.length<20)return;if(!confirm('현재 20회 기록을 완료 처리하고 새 스탬프북을 시작할까요?'))return;state.dates=[];state.paid50=false;state.paid100=false;state.cycles=(state.cycles||0)+1;save();render();renderAdmin();alert('새 20회 스탬프북을 시작했습니다.')});els.modal.addEventListener('click',e=>{if(e.target===els.modal)els.modal.style.display='none'});render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{})})();</script></body></html>
